name: Sync external jobs

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6h UTC; JSearch itself only runs once per 24h (JSEARCH_MIN_HOURS)
  workflow_dispatch:         # run it by hand from the Actions tab

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the sync endpoint
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 10 --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/external-jobs"