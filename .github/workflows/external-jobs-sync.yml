name: Sync external jobs

on:
  schedule:
    - cron: '30 2 * * *'   # once a day at 02:30 UTC = 08:00 AM Sri Lanka
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions: {}

concurrency:
  group: external-jobs-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the sync endpoint
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 10 --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/external-jobs"